[project]
name = "nat-ingest"
version = "0.1.0"
description = "Extract NAT furniture spec sheets (PDF) into structured JSON + images"
requires-python = ">=3.12"
dependencies = [
  "pillow>=11",
  "pythainlp>=5.1",
  "numpy>=2",
  "openpyxl>=3.1.5",
  "pymupdf>=1.28.2",
  "opencv-python-headless>=5.0.0.93",
  "boto3>=1.43.104",
  "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "git-filter-repo>=2.47.0",
]
